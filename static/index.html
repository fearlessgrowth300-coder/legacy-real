<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a8a">
<link rel="manifest" href="/manifest.json">
<title>Legacy Real</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--mute:#65708a;--line:#e1e5ee;--acc:#2448c7;--acc-ink:#fff;
--good:#1a7f4b;--good-bg:#e3f5ea;--mid:#9a6700;--mid-bg:#fff4d6;--bad:#b42318;--bad-bg:#fde8e7;--me:#e8eeff;--them:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--ink:#e7eaf0;--mute:#98a2b3;--line:#2a303b;
--acc:#7d9bff;--acc-ink:#0f1218;--good:#6fd39b;--good-bg:#12301f;--mid:#f1c75b;--mid-bg:#33290f;--bad:#ff8d85;
--bad-bg:#3a1714;--me:#1d2a4d;--them:#1f242e}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--mute);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;
white-space:nowrap}nav button.on{background:var(--me);color:var(--ink);font-weight:600}
.run{margin-left:auto;font-size:12px;color:var(--mid);white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 4px}h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);
color:var(--ink);font:inherit}textarea{min-height:90px}
.check{display:flex;gap:8px;align-items:center}.check input{width:auto}
button.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:10px 16px;font:inherit;
font-weight:600;cursor:pointer;margin-top:10px}button.btn[disabled]{opacity:.55;cursor:wait}
button.ghost{background:none;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;
font:inherit;cursor:pointer;margin:6px 6px 0 0}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.EXCELLENT{background:var(--good-bg);color:var(--good)}.OKAY{background:var(--mid-bg);color:var(--mid)}
.POOR,.failed,.interrupted{background:var(--bad-bg);color:var(--bad)}.UNKNOWN{background:var(--line);color:var(--mute)}
.done{background:var(--good-bg);color:var(--good)}.running{background:var(--mid-bg);color:var(--mid)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--mute);font-size:13px}.kv{font-size:14px;margin:2px 0;overflow-wrap:anywhere}
.kv b{color:var(--mute);font-weight:600;margin-right:4px}
pre{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Consolas,monospace;margin:0;overflow-wrap:anywhere}
.log{max-height:420px;overflow:auto;background:var(--bg);border-radius:8px;padding:10px}
details summary{cursor:pointer;color:var(--acc);margin-top:8px}
a{color:var(--acc)}
.msg{border-radius:12px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;border:1px solid var(--line)}
.me{background:var(--me);margin-left:12%}.them{background:var(--them);margin-right:12%}
.coach b{display:block;font-size:12px;color:var(--mute);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}
.err{color:var(--bad);margin-top:8px}.empty{color:var(--mute);text-align:center;padding:30px 10px}
.login{max-width:380px;margin:12vh auto}
@media (max-width:640px){.bar{flex-wrap:wrap}.run{margin-left:0}nav{width:100%}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">Legacy Real</div><nav id="nav"></nav><div class="run" id="run"></div></div></header>
<main id="app"></main>
<script>
const $ = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const app = document.getElementById('app'), nav = document.getElementById('nav'), runEl = document.getElementById('run');
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;           // scraped data never becomes a javascript: link
async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  if (r.status === 401) { login(); throw new Error('login'); }
  const type = r.headers.get('Content-Type') || '';
  const data = type.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || 'request failed');
  return data;
}
const TABS = [['hunt', 'Hunt'], ['person', 'Person'], ['audit', 'Audit'], ['zillow', 'Zillow'], ['jobs', 'Jobs'],
  ['leads', 'Leads'], ['reports', 'Reports'], ['chat', 'Chat'], ['status', 'Status']];
let current = 'hunt', poll = null;
function show(tab, arg) {
  current = tab; clearInterval(poll); app.innerHTML = '';
  nav.innerHTML = '';
  for (const [id, label] of TABS) { const b = $('button', id === tab ? 'on' : '', label); b.onclick = () => show(id); nav.append(b); }
  ({hunt, person, audit, zillow, jobs, leads, reports, chat, status})[tab](arg);
  try { localStorage.setItem('lr_tab', tab); } catch (e) {}
}
function head(title, sub) { app.append($('h1', null, title)); if (sub) app.append($('p', 'sub', sub)); }
function field(form, name, label, opts = {}) {
  const w = $('div'); w.append($('label', null, label));
  const i = opts.area ? $('textarea') : $('input'); i.name = name;
  if (opts.type) i.type = opts.type; if (opts.value != null) i.value = opts.value; if (opts.ph) i.placeholder = opts.ph;
  w.append(i); form.append(w); return i;
}
function jobForm(kind, title, sub, build, button) {
  head(title, sub);
  const card = $('div', 'card'), form = $('div', 'grid'); card.append(form); build(form);
  const err = $('div', 'err'), go = $('button', 'btn', button || 'Run');
  go.onclick = async () => {
    const data = {};
    for (const el of form.querySelectorAll('input,textarea,select')) data[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    go.disabled = true; err.textContent = '';
    try { const job = await api('/api/jobs/' + kind, data); show('jobs', job.id); }
    catch (e) { err.textContent = e.message; go.disabled = false; }
  };
  card.append(go, err); app.append(card);
}

function hunt() {
  jobForm('hunt', 'Hunt', 'Hot ZIPs (Realtor.com 2026) → producers on Zillow → full gap audit → Prospect Score.', f => {
    field(f, 'top', 'How many hot areas (top N)', {type: 'number', value: 3});
    field(f, 'min_price', 'Min median price ($)', {type: 'number', value: 400000});
    field(f, 'min_sales', 'Min sales / 12 months', {type: 'number', value: 20});
    field(f, 'min_reviews', 'Min reviews', {type: 'number', value: 20});
    field(f, 'per_city', 'Max agents per area', {type: 'number', value: 15});
    const w = $('div', 'check'), c = $('input'); c.type = 'checkbox'; c.name = 'teams'; w.append(c, $('span', null, 'Team leaders only')); f.append(w);
  }, 'Start hunt');
  jobForm('zips', 'ZIP search (Google Maps)', 'Top 20 agencies per ZIP, chains skipped, full audit.', f => {
    field(f, 'zips', 'ZIP codes (space or comma separated)', {ph: '01960 07042'});
  }, 'Search ZIPs');
  const list = $('div', 'card'); list.append($('h2', null, 'Hot ZIP list')); app.append(list);
  api('/api/hot-zips').then(z => { const p = $('pre'); p.textContent = z.map((r, i) => `${String(i + 1).padStart(2)}. ${r.zip} ${r.city}, ${r.state}  $${r.price.toLocaleString()}`).join('\n'); list.append(p); });
}
function person() {
  jobForm('person', 'Person', 'One LinkedIn connection: Maps + Google sweep + Zillow + websites + AI + Sales Brain → your first two messages.', f => {
    field(f, 'name', 'Full name *', {ph: 'Veores Dean'}); field(f, 'city', 'City, ST *', {ph: 'St. Louis, MO'});
    field(f, 'brokerage', 'Brokerage (optional)'); field(f, 'sites', 'Websites (optional, space separated)');
    field(f, 'phone', 'Phone from LinkedIn'); field(f, 'address', 'Address from LinkedIn');
    field(f, 'notes', 'What their LinkedIn says (headline, brand, numbers)', {area: true});
  }, 'Research this person');
}
function audit() {
  jobForm('audit', 'Audit a website', 'Page source graded like Google/AI crawlers read it. Saved as a dated report (before/after proof).', f => {
    field(f, 'url', 'Website URL *', {ph: 'https://…'}); field(f, 'address', 'Google Maps address');
    field(f, 'phone', 'Google Maps phone'); field(f, 'name', 'Business name (adds AI checks)');
  }, 'Audit');
}
function zillow() {
  jobForm('zillow', 'Zillow agents', 'Busy agents in one city from Apify (~$0.003/agent) + full audit.', f => {
    field(f, 'city', 'City, ST *', {ph: 'Peabody, MA'}); field(f, 'min_reviews', 'Min reviews', {type: 'number', value: 10});
    field(f, 'min_sales', 'Min sales / 12 months', {type: 'number', value: 10}); field(f, 'max', 'Max agents', {type: 'number', value: 25});
  }, 'Pull agents');
}

async function jobs(openId) {
  head('Jobs', 'One job runs at a time. Logs update live.');
  const box = $('div'); app.append(box);
  const render = async () => {
    const list = await api('/api/jobs'); box.innerHTML = '';
    if (!list.length) box.append($('div', 'empty', 'No jobs yet.'));
    for (const j of list) {
      const c = $('div', 'card'), r = $('div', 'row');
      const left = $('div'); left.append($('div', null, `${j.type} · ${j.started}`), $('div', 'muted', Object.entries(j.params || {}).map(([k, v]) => `${k}: ${v}`).join(' · ')));
      r.append(left, $('span', 'badge ' + j.status, j.status)); c.append(r);
      if (j.results) { const b = $('button', 'ghost', 'Open results'); b.onclick = () => show('leads', j.results); c.append(b); }
      if (j.type === 'person' && j.status === 'done') { const b = $('button', 'ghost', 'Open chat'); b.onclick = () => show('chat'); c.append(b); }
      const d = $('details'); d.append($('summary', null, 'Log')); const pre = $('pre', 'log'); d.append(pre);
      d.ontoggle = async () => { if (d.open) pre.textContent = (await api('/api/jobs/' + j.id)).log || '(empty)'; };
      if (j.id === openId) { d.open = true; }
      c.append(d); box.append(c);
    }
  };
  await render();
  poll = setInterval(async () => {
    if (current !== 'jobs') return;
    const open = [...box.querySelectorAll('details')].map(d => d.open);
    const st = await api('/api/status'); runEl.textContent = st.running ? '● job running' : '';
    if (openId) { const j = await api('/api/jobs/' + openId); const pre = box.querySelector('details[open] pre'); if (pre) { pre.textContent = j.log; pre.scrollTop = pre.scrollHeight; } if (j.status !== 'running') { openId = null; await render(); } }
    else if (st.running) await render();
  }, 3000);
}

const KEY_COLS = ['Emails', 'Main Office Phone', 'Website URL', 'Brokerage', 'Sales (12 mo)', 'Zillow Reviews', 'Est. Volume (12 mo)', 'Active Listings', 'Expansion', 'Fails'];
async function leads(file) {
  head('Leads', 'Best prospects first. Tap a lead for grades, AI checks and the pitch.');
  const files = await api('/api/results'); if (!files.length) { app.append($('div', 'empty', 'No results yet — run a Hunt, ZIP search or Zillow pull.')); return; }
  const pick = $('select'); for (const f of files) { const o = $('option', null, f); o.value = f; pick.append(o); }
  pick.value = file || files[0]; const dl = $('a', null, 'Download CSV'); const top = $('div', 'card row'); top.append(pick, dl); app.append(top);
  const list = $('div'); app.append(list);
  const load = async () => {
    dl.href = '/api/results/' + encodeURIComponent(pick.value) + '?download=1'; list.innerHTML = '';
    const rows = await api('/api/results/' + encodeURIComponent(pick.value));
    if (!rows.length) list.append($('div', 'empty', 'Empty file.'));
    for (const r of rows) {
      const c = $('div', 'card'), score = (r['Prospect Score'] || '').split(':')[0] || 'UNKNOWN';
      const h = $('div', 'row'); h.append($('h2', null, r['Business Name'] || '(no name)'), $('span', 'badge ' + score, score)); c.append(h);
      if (r['Prospect Score']) c.append($('div', 'muted', r['Prospect Score'].split(':').slice(1).join(':').trim()));
      for (const k of KEY_COLS) {
        const v = r[k]; if (!v) continue; const line = $('div', 'kv'); line.append($('b', null, k + ':'));
        if (k === 'Website URL' && safeUrl(v)) { const a = $('a', null, v); a.href = v; a.target = '_blank'; a.rel = 'noopener noreferrer'; line.append(a); }
        else if (k === 'Main Office Phone') { const a = $('a', null, v); a.href = 'tel:' + v.replace(/[^\d+]/g, ''); line.append(a); }
        else line.append(document.createTextNode(v));
        c.append(line);
      }
      const socials = ['Instagram', 'Facebook', 'Linkedin', 'Tiktok', 'Youtube', 'X'].filter(k => safeUrl(r[k]));
      if (socials.length) { const s = $('div', 'kv'); s.append($('b', null, 'Social:')); for (const k of socials) { const a = $('a', null, k + ' '); a.href = r[k]; a.target = '_blank'; a.rel = 'noopener noreferrer'; s.append(a); } c.append(s); }
      const d = $('details'); d.append($('summary', null, 'Grades, AI checks & pitch'));
      for (const k of ['Schema', 'Geo Pin', 'Schema Data', 'NAP', 'H1', 'Speed', 'Other Issues', 'AI Review', 'AI Visibility', 'Test in ChatGPT']) {
        if (r[k]) { const line = $('div', 'kv'); line.append($('b', null, k + ':')); const p = $('pre'); p.textContent = r[k]; line.append(p); d.append(line); }
      }
      if (r['Pitch']) { const line = $('div', 'kv'); line.append($('b', null, 'Pitch:')); const p = $('pre'); p.textContent = r['Pitch']; line.append(p);
        const cp = $('button', 'ghost', 'Copy pitch'); cp.onclick = () => navigator.clipboard.writeText(r['Pitch']).then(() => cp.textContent = 'Copied'); line.append(cp); d.append(line); }
      c.append(d); list.append(c);
    }
  };
  pick.onchange = load; await load();
}

async function reports() {
  head('Reports', 'Person research and website audits (dated — your before/after proof).');
  const files = await api('/api/reports'); if (!files.length) { app.append($('div', 'empty', 'No reports yet.')); return; }
  for (const f of files) {
    const c = $('div', 'card'), d = $('details'); d.append($('summary', null, f)); const pre = $('pre'); d.append(pre);
    d.ontoggle = async () => { if (d.open && !pre.textContent) pre.textContent = await api('/api/reports/' + encodeURIComponent(f)); };
    c.append(d); app.append(c);
  }
}

async function chat(slug) {
  if (!slug) {
    head('Prospect Chat', 'Paste what they reply → what it means + the next message, from your Sales Brain.');
    const people = await api('/api/people'); if (!people.length) app.append($('div', 'empty', 'Run Person on someone first.'));
    for (const p of people) { const c = $('div', 'card row'); c.append($('div', null, `${p.name} · ${p.turns} messages`)); const b = $('button', 'ghost', p.turns ? 'Open chat' : 'Start chat'); b.onclick = () => show('chat', p.slug); c.append(b); app.append(c); }
    return;
  }
  const d = await api('/api/chat/' + slug); const back = $('button', 'ghost', '← All people'); back.onclick = () => show('chat'); app.append(back); head(d.name);
  const rep = $('details', 'card'); rep.append($('summary', null, 'Research & first messages'), $('pre', null, d.report)); app.append(rep);
  const mine = $('textarea');
  for (const t of d.turns) {
    const m = $('div', 'msg ' + (t.role === 'me' ? 'me' : 'them')); m.append($('div', 'muted', t.role === 'me' ? 'You' : d.name), document.createTextNode(t.text)); app.append(m);
    if (t.coach) {
      const c = $('div', 'card coach');
      for (const [k, l] of [['said', 'What they said'], ['meaning', 'What it means'], ['next_goal', 'Next goal'], ['reply', 'Suggested reply'], ['why', 'Why (Sales Brain)'], ['watch_out', "Don't say"]]) if (t.coach[k]) c.append($('b', null, l), $('div', null, t.coach[k]));
      if ((t.coach.principles || []).length) c.append($('b', null, 'Principles pulled'), $('div', null, t.coach.principles.join(' · ')));
      const u = $('button', 'ghost', 'Use this reply'); u.onclick = () => { mine.value = t.coach.reply; mine.focus(); }; c.append(u); app.append(c);
    }
  }
  const box = $('div', 'card'), theirs = $('textarea'); theirs.placeholder = 'Paste what ' + d.name + ' replied';
  const go = $('button', 'btn', 'Break it down + suggest reply'), err = $('div', 'err');
  go.onclick = async () => { if (!theirs.value.trim()) return; go.disabled = true; go.textContent = 'Thinking… (30-90s)';
    try { await api('/api/chat/' + slug + '/theirs', {text: theirs.value}); show('chat', slug); } catch (e) { err.textContent = e.message; go.disabled = false; } };
  mine.placeholder = 'What you actually sent (log it so the next advice knows)'; if (!d.turns.length) mine.value = d.first_message;
  const log = $('button', 'ghost', d.turns.length ? 'Log my message' : 'Log first message as sent');
  log.onclick = async () => { if (!mine.value.trim()) return; await api('/api/chat/' + slug + '/mine', {text: mine.value}); show('chat', slug); };
  box.append($('label', null, 'Their reply'), theirs, go, err, $('label', null, 'Your message'), mine, log); app.append(box);
  scrollTo(0, document.body.scrollHeight);
}

async function status() {
  head('Status');
  const s = await api('/api/status'), c = $('div', 'card');
  c.append($('div', 'kv', 'Job running: ' + (s.running || 'none')));
  c.append($('div', 'kv', s.apify ? `Apify credit: $${s.apify.used} of $${s.apify.limit} used this month` : 'Apify: not connected'));
  for (const [k, v] of Object.entries(s.keys)) c.append($('div', 'kv', `${v ? '✅' : '—'} ${k}`));
  const out = $('button', 'ghost', 'Log out'); out.onclick = async () => { await api('/api/logout', {}); login(); }; c.append(out);
  app.append(c);
}

function login() {
  clearInterval(poll); nav.innerHTML = ''; app.innerHTML = '';
  const c = $('div', 'card login'); c.append($('h1', null, 'Legacy Real'), $('p', 'sub', 'Enter your private access key.'));
  const k = $('input'); k.type = 'password'; k.autocomplete = 'current-password'; const err = $('div', 'err'), go = $('button', 'btn', 'Log in');
  const submit = async () => { try { await api('/api/login', {key: k.value}); show(localStorage.getItem('lr_tab') || 'hunt'); } catch (e) { err.textContent = e.message; } };
  go.onclick = submit; k.onkeydown = e => { if (e.key === 'Enter') submit(); };
  c.append(k, go, err); app.append(c); k.focus();
}
api('/api/status').then(s => { runEl.textContent = s.running ? '● job running' : ''; let t = 'hunt'; try { t = localStorage.getItem('lr_tab') || t; } catch (e) {} show(t); }).catch(() => {});
</script>
</body>
</html>
